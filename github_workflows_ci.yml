# .github/workflows/ci.yml
# TODO(codex): 依存インストール手順・作業ディレクトリを実環境に合わせて修正すること
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # TODO(codex): requirements.txt / pyproject.toml の実態に合わせる
      - name: Install
        run: pip install -e ".[dev]" || pip install -r requirements.txt
      - name: Tests (incl. golden)
        run: pytest -q

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      # ui:build / i18n:check / i18n:coverage / i18n:test を内包
      # TODO(codex): i18n:coverage の方式（エンジン起動 or fixture）に合わせてステップを調整
      - name: UI CI
        run: npm run ci
      - name: Pseudo-locale build
        run: npm run ui:build:pseudo

  pii-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # TODO(codex): G1のスキャンスクリプトを scripts/pii-scan.sh として整備し呼び出す
      #（またはgitleaks-actionへ置換してよい）
      - name: PII / secret scan
        run: bash scripts/pii-scan.sh
