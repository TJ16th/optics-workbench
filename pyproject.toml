[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optics-engine"
version = "0.1.0"
description = "Phase 1-2 MVP optical simulation engine"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pydantic>=2",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["optics_engine*"]
exclude = ["apps*", "bench_results*", "benchmarks*", "doc*", "tests*"]
